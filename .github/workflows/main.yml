name: Publish Notebook to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Cache Quarto cell cache
        uses: actions/cache@v4
        with:
          path: _cache
          key: quarto-cache-${{ github.run_id }}
          restore-keys: |
            quarto-cache-

      - name: Render notebook
        run: uv run quarto render hubbard-trotter.ipynb

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
